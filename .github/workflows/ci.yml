name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions and detekt tasks
        run: |
          java -version
          ./gradlew --version
          ./gradlew tasks --all | grep -i detekt || true
      - name: Check (the gate)
        run: ./gradlew check --continue
      - name: Wrong keys must be rejected (2.x keys on detekt 1.x)
        if: always()
        continue-on-error: true
        run: ./gradlew detekt -Pdetekt.badConfig=true
